<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HusariaBot | Logowanie</title>
  <link rel="icon" type="image/x-icon" href="/img/hussars_logo_80x80.png">
  <link rel="stylesheet" href="/public/css/style.css">
  <style>
    body.login-body {
      background: radial-gradient(1200px 700px at 80% -10%, rgba(220, 20, 60, 0.2), transparent 55%),
        radial-gradient(1000px 600px at -10% 15%, rgba(255, 215, 0, 0.08), transparent 60%),
        linear-gradient(160deg, var(--bg-deep), #0f1216 55%, #0a0c10);
      font-family: "Trebuchet MS", "Gill Sans", "Lucida Sans", sans-serif;
      overflow: hidden;
    }

    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 20px;
      position: relative;
    }

    .login-rune {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 30%, rgba(220, 20, 60, 0.45), transparent 65%);
      top: 8%;
      right: 6%;
      opacity: 0.7;
      filter: blur(0px);
      animation: drift 12s ease-in-out infinite;
      pointer-events: none;
    }

    .login-rune.alt {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle at 70% 30%, rgba(255, 215, 0, 0.2), transparent 65%);
      bottom: 6%;
      left: 6%;
      animation-delay: -4s;
    }

    .login-card {
      width: min(620px, 92vw);
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 40px;
      box-shadow: var(--shadow-lg);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(220, 20, 60, 0.18), transparent 45%);
      opacity: 0.8;
      pointer-events: none;
    }

    .login-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }

    .login-logo {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      background: var(--bg-card);
      display: grid;
      place-items: center;
    }

    .login-logo img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .login-title {
      font-size: clamp(26px, 3.6vw, 36px);
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .login-subtitle {
      color: var(--text-secondary);
      margin-top: 6px;
      font-size: 14px;
    }

    .login-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(220, 20, 60, 0.14);
      color: var(--accent);
      border: 1px solid rgba(220, 20, 60, 0.35);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .login-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 26px;
      position: relative;
      z-index: 1;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 18px;
      border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--accent), #ff3a5f 70%);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.02em;
      border: 1px solid rgba(220, 20, 60, 0.6);
      box-shadow: 0 10px 22px rgba(220, 20, 60, 0.35);
      transition: transform var(--transition), box-shadow var(--transition);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(220, 20, 60, 0.45);
    }

    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-hover);
      color: var(--text-secondary);
      text-decoration: none;
      font-weight: 600;
      background: rgba(0, 0, 0, 0.15);
      transition: var(--transition);
    }

    .btn-ghost:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .login-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .login-chip {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 6px;
    }

    .login-chip strong {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .login-chip span {
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
    }

    .login-note {
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 12px;
    }

    @keyframes drift {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-18px); }
    }

    @media (max-width: 520px) {
      .login-card {
        padding: 32px 24px;
      }

      .login-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body class="login-body">
  <div class="login-shell">
    <div class="login-rune"></div>
    <div class="login-rune alt"></div>

    <main class="login-card" role="main">
      <div class="login-header">
        <div class="login-logo">
          <img src="/img/hussars_logo_80x80.png" alt="HusariaBot">
        </div>
        <div>
          <div class="login-title">Dashboard HusariaBot</div>
          <div class="login-subtitle">Zaloguj się, aby otrzymać dostęp do panelu administracyjnego.</div>
        </div>
      </div>

      <div class="login-actions">
        <a class="btn-primary" href="/auth/discord?source=login">Zaloguj się przez Discord</a>


      <div class="login-note">Masz problem z dostepem? Skontaktuj sie z administracja.</div>
    </main>
  </div>
</body>
</html>
