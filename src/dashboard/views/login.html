<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HusariaBot | Logowanie</title>
  <link rel="icon" type="image/x-icon" href="/img/DNA.png">
  <link rel="stylesheet" href="/public/css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 1100px 700px at 80% -5%, rgba(220, 20, 60, 0.22), transparent 55%),
        radial-gradient(ellipse 800px 600px at -5% 100%, rgba(220, 20, 60, 0.1), transparent 55%),
        var(--bg-deep);
    }

    .glow {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(100px);
      animation: float 16s ease-in-out infinite;
    }
    .glow-1 {
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(220,20,60,0.28), transparent 70%);
      top: -180px; right: -140px;
      opacity: 0.6;
    }
    .glow-2 {
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(220,20,60,0.14), transparent 70%);
      bottom: -100px; left: -80px;
      opacity: 0.5;
      animation-delay: -7s;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-30px); }
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: min(520px, 100%);
      background: var(--bg-secondary);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 24px;
      padding: 60px 52px 52px;
      box-shadow:
        0 0 0 1px rgba(220,20,60,0.1),
        0 32px 80px rgba(0,0,0,0.7),
        0 8px 32px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .login-card::before {
      content: "";
      position: absolute;
      top: 0; left: 15%; right: 15%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(220,20,60,0.8), rgba(255,215,0,0.4), rgba(220,20,60,0.8), transparent);
    }

    .login-logo-wrap {
      position: relative;
      width: 96px; height: 96px;
      border-radius: 50%;
      margin-bottom: 28px;
      display: grid;
      place-items: center;
      background: conic-gradient(from 180deg, var(--accent), #6b0018, #1a0005, var(--accent));
      padding: 3px;
      box-shadow:
        0 0 28px rgba(220,20,60,0.4),
        0 0 60px rgba(220,20,60,0.15);
      animation: spin-ring 8s linear infinite;
    }

    @keyframes spin-ring {
      from { background: conic-gradient(from 0deg, var(--accent), #6b0018, #1a0005, var(--accent)); }
      to   { background: conic-gradient(from 360deg, var(--accent), #6b0018, #1a0005, var(--accent)); }
    }

    .login-logo-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: var(--bg-secondary);
      display: grid;
      place-items: center;
    }

    .login-logo-wrap img {
      width: 62px; height: 62px;
      object-fit: contain;
      border-radius: 50%;
    }

    .login-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      line-height: 1.15;
      background: linear-gradient(135deg, #ff2244 0%, #dc143c 40%, #7a0018 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 340px;
      margin-bottom: 40px;
    }

    .btn-login {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px 24px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #e8203e);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.01em;
      box-shadow:
        0 8px 28px rgba(220,20,60,0.45),
        0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow:
        0 14px 36px rgba(220,20,60,0.55),
        0 4px 12px rgba(0,0,0,0.4);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .login-note {
      margin-top: 22px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .login-footer {
      position: fixed;
      bottom: 20px;
      left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      z-index: 1;
    }

    .login-footer-link {
      color: var(--text-muted);
      text-decoration: none;
      transition: color var(--transition);
    }

    .login-footer-link:hover {
      color: var(--accent);
    }

    @media (max-width: 480px) {
      .login-card { padding: 48px 28px 40px; }
      .login-title { font-size: 26px; }
    }
  </style>
</head>
<body>

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="login-card">

    <div class="login-logo-wrap">
      <div class="login-logo-inner">
        <img src="/img/DNA.png" alt="HusariaBot">
      </div>
    </div>

    <div class="login-title">HusariaBot</div>
    <div class="login-subtitle">Panel administracyjny. Zaloguj się kontem Discord, aby kontynuować.</div>

    <a class="btn-login" href="/auth/discord?source=login">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

      </svg>
      Zaloguj się przez Discord
    </a>

    <div class="login-note">Masz problem z dostępem? Skontaktuj się z administracją.</div>

  </div>

  <footer class="login-footer">
    &copy; 2026 HusariaBot - created by <a href="https://github.com/Kscepersky" target="_blank" rel="noopener" class="login-footer-link">@Kscepersky</a>
  </footer>

</body>
</html>
